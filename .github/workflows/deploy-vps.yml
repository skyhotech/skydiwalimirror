# Deploys the backend on main to the Ubuntu VPS after CI passes. The frontend
# is on Vercel; only the API code, frames and Python packages go to the VPS.
# The VPS cannot reach PyPI reliably, so packages are downloaded here and
# sent along. MySQL data and uploaded images on the VPS are never touched.
# Needs repo secrets VPS_HOST, VPS_SSH_KEY and VPS_KNOWN_HOSTS; without them
# the job skips itself.
name: Deploy to VPS
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vps-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Check deploy settings
        id: cfg
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::VPS_HOST secret not set; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          # The exact commit CI just tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Download Python packages for the VPS
        if: steps.cfg.outputs.skip != 'true'
        run: |
          grep -v mysqlclient backend/requirements.txt | sed 's/;.*//' > /tmp/req.txt
          pip download -q -d wheels --only-binary=:all: --python-version 3.12 \
            --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 -r /tmp/req.txt
          # mysqlclient is built once on the server; only a version change needs this source.
          v=$(grep -o 'mysqlclient==[0-9.]*' backend/requirements.txt | cut -d= -f3)
          curl -fsSL -o "wheels/mysqlclient-$v.tar.gz" \
            "$(curl -fsS "https://pypi.org/pypi/mysqlclient/$v/json" | python -c "import json,sys;print([u['url'] for u in json.load(sys.stdin)['urls'] if u['packagetype']=='sdist'][0])")"
      - name: SSH key
        if: steps.cfg.outputs.skip != 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Upload
        if: steps.cfg.outputs.skip != 'true'
        run: |
          R="deployer@$HOST"
          # Backend code only: the server's .env, database, photos and venv stay put.
          rsync -az --delete \
            --exclude .env --exclude '.env.*' --exclude '.venv/' --exclude 'db.sqlite3*' \
            --exclude 'media/' --exclude 'backups/' --exclude 'staticfiles/' --exclude '__pycache__/' \
            backend/ "$R:/opt/skymirror/backend/"
          rsync -az --delete public/frames/ "$R:/opt/skymirror/public/frames/"
          rsync -az --delete wheels/ "$R:/opt/skymirror/wheels/"
          rsync -az deploy/vps/remote-deploy.sh "$R:/opt/skymirror/remote-deploy.sh"
      - name: Install and restart
        if: steps.cfg.outputs.skip != 'true'
        run: ssh "deployer@$HOST" bash /opt/skymirror/remote-deploy.sh
      - name: Check the live API
        if: steps.cfg.outputs.skip != 'true'
        run: |
          for i in $(seq 1 10); do
            curl -fsS -o /dev/null "https://$HOST/api/mirrors/version/" && { echo "Live: https://$HOST/api/"; exit 0; }
            sleep 3
          done
          echo "::error::https://$HOST/api/ is not responding after deploy"; exit 1
