<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKY Mirror Admin</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #17120d; color: #fff9f0; font-family: system-ui, sans-serif; }
    form { width: min(360px, calc(100vw - 32px)); background: #241b13; border: 1px solid #3d2f20; border-radius: 16px; padding: 28px; }
    h1 { margin: 0 0 4px; font-size: 22px; color: #e8bd62; }
    p { margin: 0 0 20px; color: #b8a58c; font-size: 14px; }
    label { display: block; font-size: 13px; margin: 12px 0 6px; color: #d9c7ad; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px solid #4a3a28; background: #17120d; color: inherit; font-size: 15px; }
    button { margin-top: 20px; width: 100%; padding: 11px; border: 0; border-radius: 10px; background: #d6a447; color: #17120d; font-weight: 700; font-size: 15px; cursor: pointer; }
    .password { position: relative; }
    .password input { padding-right: 64px; }
    .password button { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); margin: 0; width: auto; padding: 5px 8px; background: none; color: #e8bd62; font-size: 13px; font-weight: 600; }
    .error { color: #ff8a8a; font-size: 14px; }
  </style>
</head>
<body>
  <form method="post">
    {% csrf_token %}
    <h1>SKY Mirror Admin</h1>
    <p>Sign in with a staff account.</p>
    {% if form.non_field_errors %}<div class="error" role="alert">{{ form.non_field_errors.0 }}</div>{% elif form.errors %}<div class="error" role="alert">Wrong username or password, or the account isn't staff.</div>{% endif %}
    <label for="id_username">Username</label>
    <input id="id_username" name="username" autocomplete="username" required autofocus>
    <label for="id_password">Password</label>
    <div class="password">
      <input id="id_password" name="password" type="password" autocomplete="current-password" required>
      <button type="button" id="toggle-password" aria-controls="id_password" aria-pressed="false" aria-label="Show password">Show</button>
    </div>
    <input type="hidden" name="next" value="{{ next|default:'/sky/mirror/admin/' }}">
    <button type="submit">Sign in</button>
  </form>
  <script>
    const password = document.getElementById("id_password");
    const toggle = document.getElementById("toggle-password");
    toggle.addEventListener("click", () => {
      const show = password.type === "password";
      password.type = show ? "text" : "password";
      toggle.textContent = show ? "Hide" : "Show";
      toggle.setAttribute("aria-pressed", String(show));
      toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });
  </script>
</body>
</html>
