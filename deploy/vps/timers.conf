# Unit files for backups and health checks; remote setup splits this file.
--- skymirror-backup.service
[Unit]
Description=SKY Diwali nightly backup
[Service]
Type=oneshot
ExecStart=/usr/local/sbin/skymirror-backup
Nice=10
IOSchedulingClass=idle
--- skymirror-backup.timer
[Unit]
Description=Run SKY Diwali backup nightly
[Timer]
OnCalendar=*-*-* 03:30:00
Persistent=true
[Install]
WantedBy=timers.target
--- skymirror-health.service
[Unit]
Description=SKY Diwali health check
[Service]
Type=oneshot
ExecStart=/usr/local/sbin/skymirror-health
--- skymirror-health.timer
[Unit]
Description=Check SKY Diwali API every 5 minutes
[Timer]
OnBootSec=3min
OnUnitActiveSec=5min
[Install]
WantedBy=timers.target
